{% load i18n %}
<figure class="login-preview" aria-label="{% translate 'Sample workspace' %}" aria-describedby="login-preview-caption">
  <div class="login-preview-app" role="img" aria-hidden="true">
    <div class="login-preview-sidebar">
      <span class="login-preview-brand">
        <span class="mark"><svg class="icon"><use href="#i-check"/></svg></span>
        <span class="login-preview-brand-name">{% translate 'Workspace' %}</span>
      </span>
      <span class="login-preview-nav-item"><svg class="icon"><use href="#i-grid"/></svg>{% translate 'Overview' %}</span>
      <span class="login-preview-nav-item is-active"><svg class="icon"><use href="#i-list-todo"/></svg>{% translate 'Tasks' %}<span class="login-preview-nav-count">3</span></span>
      <span class="login-preview-nav-item"><svg class="icon"><use href="#i-circle-check"/></svg>{% translate 'Completed' %}<span class="login-preview-nav-count">2</span></span>
    </div>
    <div class="login-preview-main">
      <div class="login-preview-head">
        <span class="login-preview-wordmark" id="login-preview-title">{% translate 'Your tasks' %}</span>
        <span class="login-preview-sample">{% translate 'Sample workspace' %}</span>
      </div>
      <p class="login-preview-progress">
        <span class="login-preview-progress-count"><strong>2/5</strong> {% translate 'Completed' %}</span>
        <span class="login-preview-progress-value">40%</span>
      </p>
      {# Progress is derived from the sample list below: 2 of 5 tasks completed = 40%. #}
      <div class="login-preview-track"><span class="login-preview-fill" style="width: 40%;"></span></div>
      <ul class="login-preview-tasks">
        <li class="login-preview-task">
          <span class="login-preview-task-icon login-preview-task-pending"><svg class="icon"><use href="#i-circle-dashed"/></svg></span>
          <div class="login-preview-task-copy">
            <p>{% translate 'Review the launch checklist' %}</p>
            <span class="login-preview-task-meta"><svg class="icon"><use href="#i-calendar"/></svg>{% translate 'Today' %}</span>
          </div>
        </li>
        <li class="login-preview-task">
          <span class="login-preview-task-icon login-preview-task-pending"><svg class="icon"><use href="#i-circle-dashed"/></svg></span>
          <div class="login-preview-task-copy">
            <p>{% translate 'Send the weekly update' %}</p>
            <span class="login-preview-task-meta"><svg class="icon"><use href="#i-calendar"/></svg>{% translate 'Tomorrow' %}</span>
          </div>
        </li>
        <li class="login-preview-task">
          <span class="login-preview-task-icon login-preview-task-pending"><svg class="icon"><use href="#i-circle-dashed"/></svg></span>
          <div class="login-preview-task-copy">
            <p>{% translate 'Draft the meeting agenda' %}</p>
            <span class="login-preview-task-meta"><svg class="icon"><use href="#i-calendar"/></svg>{% translate 'Friday' %}</span>
          </div>
        </li>
        <li class="login-preview-task login-preview-task-complete">
          <span class="login-preview-task-icon"><svg class="icon"><use href="#i-circle-check"/></svg></span>
          <div class="login-preview-task-copy">
            <p>{% translate 'Prepare the project brief' %}</p>
            <span class="login-preview-task-meta">{% translate 'Completed' %}</span>
          </div>
        </li>
        <li class="login-preview-task login-preview-task-complete">
          <span class="login-preview-task-icon"><svg class="icon"><use href="#i-circle-check"/></svg></span>
          <div class="login-preview-task-copy">
            <p>{% translate 'Plan the week ahead' %}</p>
            <span class="login-preview-task-meta">{% translate 'Completed' %}</span>
          </div>
        </li>
      </ul>
    </div>
  </div>
  <figcaption id="login-preview-caption">{% translate 'Illustrative preview with sample tasks, not your account data.' %}</figcaption>
</figure>
