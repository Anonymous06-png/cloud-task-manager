
services:
  db:
    image: postgres:16-alpine
    container_name: taskmanager-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskmanager}
      POSTGRES_USER: ${POSTGRES_USER:-taskuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskuser} -d ${POSTGRES_DB:-taskmanager}"]
      interval: 10s
      timeout: 3s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloud-task-manager:v1.0-django
    container_name: taskmanager-app
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8080 --workers 3 --timeout 60 config.wsgi:application"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Required: compose fails fast if SECRET_KEY is unset or empty.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      # Local stack serves plain HTTP on 127.0.0.1. Production must set
      # DJANGO_ENV=production and SECURE_SSL_REDIRECT=True behind TLS.
      DJANGO_ENV: ${DJANGO_ENV:-local}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskuser}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-taskmanager}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - static_volume:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/').read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
